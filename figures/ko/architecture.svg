<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img">
<title>IntentLock 구현과 평가 범위</title>
<metadata>IntentLock run primary-solo-v0.4.0-01</metadata>
<rect width="900" height="560" fill="#ffffff"/>
<g font-family="Malgun Gothic, Noto Sans KR, sans-serif" font-size="12" fill="#243240">
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#243240"/></marker></defs>
<text x="28" y="38" font-size="22" font-weight="700">IntentLock 구현과 평가 범위</text>
<text x="28" y="64" font-size="12" fill="#596674">범위를 구분: 선택적 계약 생성·검사, 측정한 재생 평가, 지갑 연결 모듈</text>
<text x="28" y="99" font-weight="700">선택적 계약 생성·검사 — 자연어 정확도나 실제 사용자 동의를 측정한 보장이 아님</text>
<rect x="40" y="114" width="220" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="150" y="139" text-anchor="middle" font-size="13" font-weight="700">텍스트와 필드별 근거</text>
<text x="150" y="160" text-anchor="middle" font-size="10">호출자가 준 근거; 오염 추적은 아님</text>
<rect x="320" y="114" width="250" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="445" y="139" text-anchor="middle" font-size="13" font-weight="700">계약 생성·검사</text>
<text x="445" y="160" text-anchor="middle" font-size="10">자료 형식·부분 문자열·권한 확대 검사</text>
<rect x="630" y="114" width="230" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="745" y="139" text-anchor="middle" font-size="13" font-weight="700">구조화된 경제 의도 계약</text>
<text x="745" y="160" text-anchor="middle" font-size="10">사용자 확인 표시는 호출자가 제공</text>
<line x1="260" y1="146" x2="316" y2="146" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="146" x2="626" y2="146" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="213" font-weight="700">측정한 M3 — 작성된 계약을 전제로 한 오프라인 재생</text>
<rect x="40" y="228" width="240" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="160" y="253" text-anchor="middle" font-size="13" font-weight="700">작성된 계약과 호출 기록</text>
<text x="160" y="274" text-anchor="middle" font-size="10">고정 시험 자료와 변이 목록</text>
<rect x="330" y="228" width="240" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="450" y="253" text-anchor="middle" font-size="13" font-weight="700">다섯 비교 시스템</text>
<text x="450" y="274" text-anchor="middle" font-size="10">반사실적 방어 판단</text>
<rect x="620" y="228" width="240" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="740" y="253" text-anchor="middle" font-size="13" font-weight="700">오프라인 평가 지표</text>
<text x="740" y="274" text-anchor="middle" font-size="10">작성된 결과 기준; 실제 손실 아님</text>
<line x1="280" y1="260" x2="326" y2="260" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="570" y1="260" x2="616" y2="260" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<text x="28" y="329" font-weight="700">지갑 연결 모듈 — 하나의 경로에서 검사·예약·실행·상태 대조</text>
<rect x="40" y="348" width="180" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="130" y="373" text-anchor="middle" font-size="13" font-weight="700">호출 해석과 누적 검사</text>
<text x="130" y="394" text-anchor="middle" font-size="10">허용 / 거부 / 사용자 확인</text>
<rect x="253" y="348" width="190" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="348" y="373" text-anchor="middle" font-size="13" font-weight="700">메모리 내 예약 원장</text>
<text x="348" y="394" text-anchor="middle" font-size="10">단일 프로세스의 예약 검사</text>
<rect x="476" y="348" width="180" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="566" y="373" text-anchor="middle" font-size="13" font-weight="700">지갑 실행기</text>
<text x="566" y="394" text-anchor="middle" font-size="10">예약 성공 후에만 실행</text>
<rect x="689" y="348" width="171" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="774.5" y="373" text-anchor="middle" font-size="13" font-weight="700">거래 영수증 검사</text>
<text x="774.5" y="394" text-anchor="middle" font-size="10">실행 후 상태 대조</text>
<line x1="220" y1="380" x2="249" y2="380" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="443" y1="380" x2="472" y2="380" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="656" y1="380" x2="685" y2="380" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M774 412 L774 446 L348 446 L348 415" fill="none" stroke="#243240" stroke-width="2" marker-end="url(#arrow)"/>
<text x="570" y="438" text-anchor="middle" font-size="11">실행 완료 / 실패 / 위반 상태 기록</text>
<text x="28" y="480" font-size="12">불일치 시 위반 예산도 계속 계산 · 이후 모든 서명을 일괄 동결하는 기능은 없음</text>
<text x="28" y="503" font-size="12">분산·영속 저장 미구현 · 확인 표시는 호출자가 제공 · 해석·모의 검사의 건전성은 전제</text>
<text x="450" y="545" text-anchor="middle" font-size="11" fill="#596674">실행: primary-solo-v0.4.0-01</text>
</g>
</svg>