<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="827" viewBox="0 0 1440 827" role="img" aria-labelledby="security-utility-title security-utility-desc">
<title id="security-utility-title">보호 체계 비교</title>
<desc id="security-utility-desc">같은 0–100% 축의 비율과 95% 구간. 위반 허용률의 분모는 전체 400건이며 정상 완료율의 분모는 비적대적 160건(원본 80건과 이탈 80건)이다. 선은 기본 의도 80개 묶음을 유지한 10,000회 부트스트랩 구간이다. 폭이 0인 구간은 점과 겹친다. 작성된 계약과 호출 기록의 첫 시도 오프라인 재생이며 실지갑 공격 성공률이나 새로운 사용자에 대한 일반화 보장이 아니다. 가드 모형은 공개 정책을 재현한 비교 모형이다. 언어모델 최초 요청 실패 92건을 제외하지 않는다.</desc>
