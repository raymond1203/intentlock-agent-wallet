<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1012" viewBox="0 0 1440 1012" role="img" aria-labelledby="latency-title latency-desc">
<title id="latency-title">평가 경로의 평균 지연</title>
<desc id="latency-desc">첫 시도 400건씩의 meanLatencyMs. 위 패널은 모든 체계를 0–1,500밀리초 축에 표시하며, 아래 패널은 언어모델 검증기를 제외한 네 체계를 0–0.5밀리초 축에 따로 확대했다. 막대 너비는 실제 값에 선형 비례하며 작은 막대에 최소 너비를 부여하지 않는다. 수치는 소수 셋째 자리까지 표시한다. 원격 언어모델 요청과 로컬 규칙 평가의 측정 경로가 다르므로 지갑 종단 간 속도나 추론만의 속도, 인과적인 속도 배수로 읽지 않는다. RPC·서명·사용자 확인·블록 확정 시간을 대표하지 않는다.</desc>
<style>text{font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}line,rect,circle{vector-effect:non-scaling-stroke}</style>
