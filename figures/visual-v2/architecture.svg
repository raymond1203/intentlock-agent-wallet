<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="860" viewBox="0 0 1440 860" role="img" aria-labelledby="title desc">
<title id="title">실행 경로</title>
<desc id="desc">IntentLockMetaMaskAdapter.execute의 개략적 성공 경로다. 호출을 해석한 예측 효과와 설정된 계약, 호출자가 제공한 허용 효과 이력으로 evaluateIntent를 수행한다. 허용 판정 뒤 reserve가 메모리 원장의 예약·사용량과 중복 실행을 검사하고, 성공한 경우에만 executor.sendTransaction을 호출한다. 실행 영수증의 관측 효과와 예측 효과를 비교하고 최종 목표를 검사한 뒤 실제 결과를 정산한다. 평가의 비허용 판정이나 예약 거절은 실행 전에 차단된다. 원장은 evaluateIntent의 직접 입력이 아니라 reserve에서 조회된다. 실행 실패 시 가스만 정산하는 분기는 생략했다. 사후 불일치를 기록하는 것은 이미 실행된 거래의 취소나 지갑 전체의 후속 서명 동결을 뜻하지 않는다. 이 그림은 단일 프로세스 어댑터 구조를 설명하며, 실제 사용자 동의 또는 400건 오프라인 재생의 실지갑 종단 간 검증을 주장하지 않는다.</desc>
<defs>
  <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#38ABA2"/></marker>
  <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#B5B8C2"/></marker>
  <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#DD8E91"/></marker>
  <pattern id="rejected" width="13" height="13" patternUnits="userSpaceOnUse" patternTransform="rotate(35)"><line x1="0" y1="0" x2="0" y2="13" stroke="#DD8E91" stroke-opacity="0.3" stroke-width="3"/></pattern>
</defs>
<style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}line,rect,path{vector-effect:non-scaling-stroke}</style>
