one" stroke="#38ABA2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><rect x="1060" y="350" width="220" height="120" fill="#1C1D22" rx="8" stroke="#38ABA2" stroke-opacity="0.65"/><text x="1170" y="402" font-size="30" fill="#F2F3F5" text-anchor="middle" font-weight="700">대조·정산</text><text x="1170" y="439" font-size="21" fill="#B5B8C2" text-anchor="middle">reconcile</text><path d="M 300 470 V 525 H 445 V 557" fill="none" stroke="#DD8E91" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-red)"/><path d="M 540 470 V 525 H 445" fill="none" stroke="#DD8E91" stroke-width="2.5" stroke-linejoin="round" /><rect x="397" y="565" width="96" height="48" fill="#121212" rx="24" stroke="#DD8E91"/><text x="445" y="597" font-size="23" fill="#DD8E91" text-anchor="middle">차단</text><rect x="92" y="662" width="270" height="72" fill="#1C1D22" rx="8" stroke="#3B3D43"/><text x="227" y="708" font-size="24" fill="#B5B8C2" text-anchor="middle">허용 효과 이력</text><path d="M 227 662 V 476" fill="none" stroke="#B5B8C2" stroke-width="2.5" stroke-linejoin="round" stroke-dasharray="5 5" marker-end="url(#arrow-gray)"/><rect x="565" y="662" width="715" height="72" fill="#1C1D22" rx="8" stroke="#3B3D43"/><text x="922" y="708" font-size="25" fill="#F2F3F5" text-anchor="middle">원장 · 예약 / 사용량</text><path d="M 609 656 V 476" fill="none" stroke="#B5B8C2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-gray)"/><path d="M 670 476 V 656" fill="none" stroke="#38ABA2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="584" y="581" font-size="20" fill="#B5B8C2" text-anchor="end">조회</text><text x="691" y="581" font-size="20" fill="#38ABA2" >예약</text><path d="M 1170 476 V 656" fill="none" stroke="#38ABA2" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#arrow-teal)"/><text x="1191" y="581" font-size="20" fill="#38ABA2" >실측 반영</text>
<text x="72" y="825" font-size="18" fill="#B5B8C2" >Source: 본 연구</text>
