<text x="150" y="139" text-anchor="middle" font-size="13" font-weight="700">Text + field evidence</text>
<text x="150" y="160" text-anchor="middle" font-size="10">Assertions, not verified taint</text>
<rect x="320" y="114" width="250" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="445" y="139" text-anchor="middle" font-size="13" font-weight="700">Compiler checks</text>
<text x="445" y="160" text-anchor="middle" font-size="10">Schema, substring, widening checks</text>
<rect x="630" y="114" width="230" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="745" y="139" text-anchor="middle" font-size="13" font-weight="700">Typed Intent Contract</text>
<text x="745" y="160" text-anchor="middle" font-size="10">Caller supplies confirmation flags</text>
