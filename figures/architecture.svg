<text x="28" y="38" font-size="22" font-weight="700">IntentLock implementation and evaluation boundaries</text>
<text x="28" y="64" font-size="12" fill="#596674">Distinct scopes: an optional compiler, measured offline replay, and the adapter implementation</text>
<text x="28" y="99" font-weight="700">OPTIONAL COMPILER — not a measured natural-language or consent guarantee</text>
