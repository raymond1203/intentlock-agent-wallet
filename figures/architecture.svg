<text x="160" y="253" text-anchor="middle" font-size="13" font-weight="700">Authored contract + trace</text>
<text x="160" y="274" text-anchor="middle" font-size="10">Fixed fixtures and mutation manifest</text>
<rect x="330" y="228" width="240" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="450" y="253" text-anchor="middle" font-size="13" font-weight="700">Five comparison systems</text>
<text x="450" y="274" text-anchor="middle" font-size="10">Counterfactual guard decisions</text>
<rect x="620" y="228" width="240" height="64" fill="#edf4fa" stroke="#174f78"/>
<text x="740" y="253" text-anchor="middle" font-size="13" font-weight="700">Offline metrics</text>
<text x="740" y="274" text-anchor="middle" font-size="10">Authored outcomes; not live losses</text>
