<text x="570" y="438" text-anchor="middle" font-size="11">Record EXECUTED / FAILED / VIOLATED</text>
<text x="28" y="480" font-size="12">Mismatch: VIOLATED budget remains counted; no global follow-up signing freeze is implemented.</text>
<text x="28" y="503" font-size="12">No distributed durability; confirmation is caller-supplied. Decoder / simulation soundness is conditional.</text>
<text x="450" y="545" text-anchor="middle" font-size="11" fill="#596674">run primary-solo-v0.4.0-01</text>
