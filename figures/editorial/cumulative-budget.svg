<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="980" viewBox="0 0 1440 980" role="img" aria-labelledby="title desc">
<title id="title">한 번씩은 허용해도, 합치면 의도를 벗어날 수 있다</title>
<desc id="desc">검사의 단위를 호출에서 실행 과정으로 넓혀야 하는 이유 Source: 본 연구의 누적 예산 규칙을 설명하기 위한 자체 도식. 숫자 100·60·120은 이해를 돕기 위한 예시이며, 측정값이나 실제 지출 내역이 아니다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}line,rect,circle,path{vector-effect:non-scaling-stroke}</style>
<rect x="0" y="0" width="1440" height="980" fill="#121212" />
<text x="64" y="53" font-size="20" fill="#F2F3F5" font-weight="600" letter-spacing="2">INTENTLOCK / RESEARCH</text>
<text x="1376" y="53" font-size="20" fill="#B5B8C2" font-weight="500" text-anchor="end">FIGURE 01</text>
<line x1="64" y1="76" x2="1376" y2="76" stroke="#F2F3F5" stroke-width="1" />
<text x="720" y="143" font-size="38" fill="#F2F3F5" font-weight="700" text-anchor="middle">한 번씩은 허용해도, 합치면 의도를 벗어날 수 있다</text>
<text x="720" y="187" font-size="23" fill="#B5B8C2" font-weight="400" text-anchor="middle">검사의 단위를 호출에서 실행 과정으로 넓혀야 하는 이유</text>
<text x="64" y="244" font-size="22" fill="#38ABA2" font-weight="700" >설명용 예시 · 실험 결과 아님</text><rect x="64" y="272" width="1312" height="83" fill="#1C1D22" /><text x="92" y="323" font-size="28" fill="#F2F3F5" font-weight="600" >사용자 의도: 두 번의 호출을 포함한 총지출은 100 이하</text><text x="64" y="421" font-size="30" fill="#F2F3F5" font-weight="700" >호출만 따로 검사</text><text x="64" y="461" font-size="23" fill="#B5B8C2" font-weight="400" >각 호출 60 ≤ 100 → 둘 다 허용</text><line x1="170" y1="501" x2="170" y2="719" stroke="#3B3D43" stroke-width="1" /><line x1="495" y1="501" x2="495" y2="719" stroke="#F2F3F5" stroke-width="1" stroke-dasharray="5 5"/><text x="495" y="489" font-size="20" fill="#B5B8C2" font-weight="500" text-anchor="middle">한도 100</text><text x="64" y="547" font-size="22" fill="#F2F3F5" font-weight="400" >1차 호출</text><text x="64" y="652" font-size="22" fill="#F2F3F5" font-weight="400" >2차 호출</text><rect x="170" y="517" width="195" height="42" fill="#ADB4D4" data-system="PER_CALL_POLICY" data-metric="illustrativeSpend" data-value="60" data-scope="illustrative" data-ordinal="1"/><text x="377" y="547" font-size="22" fill="#F2F3F5" font-weight="400" >60 허용</text><rect x="170" y="622" width="195" height="42" fill="#ADB4D4" data-system="PER_CALL_POLICY" data-metric="illustrativeSpend" data-value="60" data-scope="illustrative" data-ordinal="2"/><text x="377" y="652" font-size="22" fill="#F2F3F5" font-weight="400" >60 허용</text><text x="64" y="767" font-size="32" fill="#F2F3F5" font-weight="700" >실행 합계 120</text><text x="64" y="809" font-size="22" fill="#B5B8C2" font-weight="400" >각 호출의 조건은 맞지만, 총액은 의도를 벗어난다.</text><text x="762" y="421" font-size="30" fill="#38ABA2" font-weight="700" >이미 쓴 금액까지 검사</text><text x="762" y="461" font-size="23" fill="#B5B8C2" font-weight="400" >60 + 60 = 120 &gt; 100 → 두 번째 거절</text><line x1="868" y1="501" x2="868" y2="719" stroke="#3B3D43" stroke-width="1" /><line x1="1193" y1="501" x2="1193" y2="719" stroke="#F2F3F5" stroke-width="1" stroke-dasharray="5 5"/><text x="1193" y="489" font-size="20" fill="#B5B8C2" font-weight="500" text-anchor="middle">한도 100</text><text x="762" y="547" font-size="22" fill="#F2F3F5" font-weight="400" >1차 호출</text><text x="762" y="652" font-size="22" fill="#F2F3F5" font-weight="400" >2차 호출</text><rect x="868" y="517" width="195" height="42" fill="#ADB4D4" data-system="INTENTLOCK" data-metric="illustrativeSpend" data-value="60" data-scope="illustrative" data-ordinal="1"/><text x="1075" y="547" font-size="22" fill="#F2F3F5" font-weight="400" >60 허용</text><rect x="868" y="622" width="195" height="42" fill="#ADB4D4" data-system="INTENTLOCK" data-metric="illustrativePreviouslySpent" data-value="60" data-scope="illustrative"/><rect x="1063" y="622" width="195" height="42" fill="none" stroke="#38ABA2" stroke-width="2" stroke-dasharray="5 4" data-system="INTENTLOCK" data-metric="illustrativeRejectedSpend" data-value="60" data-scope="illustrative"/><text x="1160.5" y="695" font-size="22" fill="#38ABA2" font-weight="600" text-anchor="middle">+60 거절</text><text x="762" y="767" font-size="32" fill="#38ABA2" font-weight="700" >실행 합계 60</text><text x="762" y="809" font-size="22" fill="#B5B8C2" font-weight="400" >예약·사용량을 이어서 보면 다음 호출을 막을 수 있다.</text><line x1="710" y1="402" x2="710" y2="847" stroke="#3B3D43" stroke-width="1" />
<line x1="64" y1="879" x2="1376" y2="879" stroke="#3B3D43" stroke-width="1" />
<text x="64" y="915" font-size="18" fill="#B5B8C2" font-weight="400" >Source: 본 연구의 누적 예산 규칙을 설명하기 위한 자체 도식.</text><text x="64" y="944" font-size="18" fill="#B5B8C2" font-weight="400" >숫자 100·60·120은 이해를 돕기 위한 예시이며, 측정값이나 실제 지출 내역이 아니다.</text>
</svg>