<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc">
<title id="title">오류 분류와 위반 허용은 서로 다른 지표다</title>
<desc id="desc">비적대적 의도 이탈의 중단도 포함된 기존 오류 분류 Source: 본 연구 주 실험 errorsByMutation 집계. 막대는 유형별 오류 건수 합계이며, 오른쪽은 상위 3개 유형. 언어모델 출력 없음 16건은 이 오류 분류의 부분집합 표기다. 최초 요청 실패 92건 전체와 혼동하지 않는다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}line,rect,circle,path{vector-effect:non-scaling-stroke}</style>
<rect x="0" y="0" width="1440" height="1120" fill="#121212" />
<text x="64" y="53" font-size="20" fill="#F2F3F5" font-weight="600" letter-spacing="2">INTENTLOCK / RESEARCH</text>
<text x="1376" y="53" font-size="20" fill="#B5B8C2" font-weight="500" text-anchor="end">FIGURE 04</text>
<line x1="64" y1="76" x2="1376" y2="76" stroke="#F2F3F5" stroke-width="1" />
<text x="720" y="143" font-size="38" fill="#F2F3F5" font-weight="700" text-anchor="middle">오류 분류와 위반 허용은 서로 다른 지표다</text>
<text x="720" y="187" font-size="23" fill="#B5B8C2" font-weight="400" text-anchor="middle">비적대적 의도 이탈의 중단도 포함된 기존 오류 분류</text>
<text x="64" y="252" font-size="24" fill="#B5B8C2" font-weight="600" >비교 체계</text><text x="360" y="252" font-size="24" fill="#B5B8C2" font-weight="600" >오류 분류 합계 / 400</text><text x="856" y="252" font-size="24" fill="#B5B8C2" font-weight="600" >각 체계의 주요 오류 유형</text><line x1="360" y1="292" x2="360" y2="847" stroke="#3B3D43" stroke-width="1" /><text x="360" y="879" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0</text><line x1="450" y1="292" x2="450" y2="847" stroke="#3B3D43" stroke-width="1" /><text x="450" y="879" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">100</text><line x1="540" y1="292" x2="540" y2="847" stroke="#3B3D43" stroke-width="1" /><text x="540" y="879" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">200</text><line x1="630" y1="292" x2="630" y2="847" stroke="#3B3D43" stroke-width="1" /><text x="630" y="879" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">300</text><line x1="720" y1="292" x2="720" y2="847" stroke="#3B3D43" stroke-width="1" /><text x="720" y="879" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">400</text><text x="64" y="343" font-size="25" fill="#ADB4D4" font-weight="600" >보호 장치 없음</text><text x="64" y="374" font-size="18" fill="#B5B8C2" font-weight="400" >NONE</text><rect x="360" y="323" width="216" height="30" fill="#ADB4D4" data-system="NONE" data-metric="errorsByMutationTotal" data-value="240" data-count="240" data-denominator="400"/><text x="809" y="347" font-size="23" fill="#ADB4D4" font-weight="600" text-anchor="end">240/400</text><text x="856" y="335" font-size="21" fill="#B5B8C2" font-weight="400" data-system="NONE" data-metric="errorsByMutation.chain-substitution" data-value="70" data-count="70" data-denominator="400">체인 바꾸기 70</text><text x="856" y="364" font-size="21" fill="#B5B8C2" font-weight="400" data-system="NONE" data-metric="errorsByMutation.gas-inflation" data-value="52" data-count="52" data-denominator="400">가스 비용 부풀리기 52</text><text x="856" y="393" font-size="21" fill="#B5B8C2" font-weight="400" data-system="NONE" data-metric="errorsByMutation.retry-double-spend" data-value="46" data-count="46" data-denominator="400">재시도 중복 지출 46</text><text x="64" y="449" font-size="25" fill="#ADB4D4" font-weight="600" >가드 모드 정책 모형</text><text x="64" y="480" font-size="18" fill="#B5B8C2" font-weight="400" >GUARD_MODE</text><rect x="360" y="429" width="83.7" height="30" fill="#ADB4D4" data-system="GUARD_MODE" data-metric="errorsByMutationTotal" data-value="93" data-count="93" data-denominator="400"/><text x="809" y="453" font-size="23" fill="#ADB4D4" font-weight="600" text-anchor="end">93/400</text><text x="856" y="441" font-size="21" fill="#B5B8C2" font-weight="400" data-system="GUARD_MODE" data-metric="errorsByMutation.gas-inflation" data-value="52" data-count="52" data-denominator="400">가스 비용 부풀리기 52</text><text x="856" y="470" font-size="21" fill="#B5B8C2" font-weight="400" data-system="GUARD_MODE" data-metric="errorsByMutation.retry-double-spend" data-value="12" data-count="12" data-denominator="400">재시도 중복 지출 12</text><text x="856" y="499" font-size="21" fill="#B5B8C2" font-weight="400" data-system="GUARD_MODE" data-metric="errorsByMutation.slippage-widening" data-value="10" data-count="10" data-denominator="400">슬리피지 확대 10</text><text x="64" y="555" font-size="25" fill="#ADB4D4" font-weight="600" >언어모델 검증기</text><text x="64" y="586" font-size="18" fill="#B5B8C2" font-weight="400" >LLM_VERIFIER</text><rect x="360" y="535" width="191.7" height="30" fill="#ADB4D4" data-system="LLM_VERIFIER" data-metric="errorsByMutationTotal" data-value="213" data-count="213" data-denominator="400"/><text x="809" y="559" font-size="23" fill="#ADB4D4" font-weight="600" text-anchor="end">213/400</text><text x="856" y="547" font-size="21" fill="#B5B8C2" font-weight="400" data-system="LLM_VERIFIER" data-metric="errorsByMutation.benign-hallucination" data-value="64" data-count="64" data-denominator="400">비적대적 잘못된 호출 64</text><text x="856" y="576" font-size="21" fill="#B5B8C2" font-weight="400" data-system="LLM_VERIFIER" data-metric="errorsByMutation.gas-inflation" data-value="44" data-count="44" data-denominator="400">가스 비용 부풀리기 44</text><text x="856" y="605" font-size="21" fill="#B5B8C2" font-weight="400" data-system="LLM_VERIFIER" data-metric="errorsByMutation.retry-double-spend" data-value="26" data-count="26" data-denominator="400">재시도 중복 지출 26</text><text x="64" y="661" font-size="25" fill="#ADB4D4" font-weight="600" >호출별 정책</text><text x="64" y="692" font-size="18" fill="#B5B8C2" font-weight="400" >PER_CALL_POLICY</text><rect x="360" y="641" width="117.9" height="30" fill="#ADB4D4" data-system="PER_CALL_POLICY" data-metric="errorsByMutationTotal" data-value="131" data-count="131" data-denominator="400"/><text x="809" y="665" font-size="23" fill="#ADB4D4" font-weight="600" text-anchor="end">131/400</text><text x="856" y="653" font-size="21" fill="#B5B8C2" font-weight="400" data-system="PER_CALL_POLICY" data-metric="errorsByMutation.benign-hallucination" data-value="65" data-count="65" data-denominator="400">비적대적 잘못된 호출 65</text><text x="856" y="682" font-size="21" fill="#B5B8C2" font-weight="400" data-system="PER_CALL_POLICY" data-metric="errorsByMutation.retry-double-spend" data-value="46" data-count="46" data-denominator="400">재시도 중복 지출 46</text><text x="856" y="711" font-size="21" fill="#B5B8C2" font-weight="400" data-system="PER_CALL_POLICY" data-metric="errorsByMutation.policy-laundering" data-value="10" data-count="10" data-denominator="400">호출 분할로 한도 우회 10</text><text x="64" y="767" font-size="25" fill="#38ABA2" font-weight="600" >IntentLock</text><text x="64" y="798" font-size="18" fill="#B5B8C2" font-weight="400" >INTENTLOCK</text><rect x="360" y="747" width="67.5" height="30" fill="#38ABA2" data-system="INTENTLOCK" data-metric="errorsByMutationTotal" data-value="75" data-count="75" data-denominator="400"/><text x="809" y="771" font-size="23" fill="#38ABA2" font-weight="600" text-anchor="end">75/400</text><text x="856" y="759" font-size="21" fill="#B5B8C2" font-weight="400" data-system="INTENTLOCK" data-metric="errorsByMutation.benign-hallucination" data-value="65" data-count="65" data-denominator="400">비적대적 잘못된 호출 65</text><text x="856" y="788" font-size="21" fill="#B5B8C2" font-weight="400" data-system="INTENTLOCK" data-metric="errorsByMutation.stale-quote" data-value="10" data-count="10" data-denominator="400">오래된 견적 10</text><text x="64" y="935" font-size="29" fill="#38ABA2" font-weight="700" >IntentLock: 오류 분류 75건 ≠ 위반 허용 10건</text><text x="64" y="978" font-size="23" fill="#B5B8C2" font-weight="400" >비적대적 잘못된 호출 65건과 오래된 견적 10건이 합산된다. 이를 손실이나 오거부 건수로 읽어서는 안 된다.</text>
<line x1="64" y1="1019" x2="1376" y2="1019" stroke="#3B3D43" stroke-width="1" />
<text x="64" y="1055" font-size="18" fill="#B5B8C2" font-weight="400" >Source: 본 연구 주 실험 errorsByMutation 집계. 막대는 유형별 오류 건수 합계이며, 오른쪽은 상위 3개 유형.</text><text x="64" y="1084" font-size="18" fill="#B5B8C2" font-weight="400" >언어모델 출력 없음 16건은 이 오류 분류의 부분집합 표기다. 최초 요청 실패 92건 전체와 혼동하지 않는다.</text>
</svg>