<desc id="desc">동일한 사례를 재생해 비교한 결과이며, 실지갑 공격 성공률은 아니다 Source: 본 연구의 주 실험 집계 · 최초 시도 400건/체계 · 원본 사례 80개, 10,000회 재표집. 95% 구간은 이 고정 벤치마크 내부의 변동성이다. 새 공격·새 사용자에 대한 일반화 보장을 뜻하지 않는다.</desc>
