<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1110" viewBox="0 0 1440 1110" role="img" aria-labelledby="title desc">
<title id="title">정책 생성, 결과 측정, 지갑 연결은 서로 다른 증거다</title>
<desc id="desc">어디를 구현했고 어디를 측정했는지 분리해서 읽기 Source: 본 연구의 구현 구조와 오프라인 재생 실험 설계. 화살표는 각 경로 내부의 처리 순서다. 선택 컴파일러 → 실지갑 보호의 종단 간 검증을 뜻하지 않는다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}line,rect,circle,path{vector-effect:non-scaling-stroke}</style>
<rect x="0" y="0" width="1440" height="1110" fill="#121212" />
<text x="64" y="53" font-size="20" fill="#F2F3F5" font-weight="600" letter-spacing="2">INTENTLOCK / RESEARCH</text>
<text x="1376" y="53" font-size="20" fill="#B5B8C2" font-weight="500" text-anchor="end">FIGURE 02</text>
<line x1="64" y1="76" x2="1376" y2="76" stroke="#F2F3F5" stroke-width="1" />
<text x="720" y="143" font-size="38" fill="#F2F3F5" font-weight="700" text-anchor="middle">정책 생성, 결과 측정, 지갑 연결은 서로 다른 증거다</text>
<text x="720" y="187" font-size="23" fill="#B5B8C2" font-weight="400" text-anchor="middle">어디를 구현했고 어디를 측정했는지 분리해서 읽기</text>
<text x="64" y="258" font-size="26" fill="#B5B8C2" font-weight="600" >01 / 선택 기능: 추출된 계약 후보와 필드별 근거 검사</text><rect x="64" y="282" width="376" height="94" fill="#1C1D22" stroke="#3B3D43"/><text x="86" y="318" font-size="25" fill="#F2F3F5" font-weight="600" >텍스트·계약 후보</text><text x="86" y="352" font-size="20" fill="#B5B8C2" font-weight="400" >필드별 근거를 함께 제공</text><line x1="448" y1="328" x2="504" y2="328" stroke="#ADB4D4" stroke-width="1.5" /><path d="M 498 322 L 506 328 L 498 334" fill="none" stroke="#ADB4D4" stroke-width="1.5"/><rect x="520" y="282" width="376" height="94" fill="#1C1D22" stroke="#3B3D43"/><text x="542" y="318" font-size="25" fill="#F2F3F5" font-weight="600" >계약 생성·검사</text><text x="542" y="352" font-size="20" fill="#B5B8C2" font-weight="400" >형식·근거·권한 확대 검사</text><line x1="904" y1="328" x2="960" y2="328" stroke="#ADB4D4" stroke-width="1.5" /><path d="M 954 322 L 962 328 L 954 334" fill="none" stroke="#ADB4D4" stroke-width="1.5"/><rect x="976" y="282" width="400" height="94" fill="#1C1D22" stroke="#3B3D43"/><text x="998" y="318" font-size="25" fill="#F2F3F5" font-weight="600" >구조화된 경제 의도 계약</text><text x="998" y="352" font-size="20" fill="#B5B8C2" font-weight="400" >확인 표시는 호출자가 제공</text><text x="64" y="414" font-size="22" fill="#B5B8C2" font-weight="400" >컴파일러의 출력만으로 실제 동의나 외부 입력의 오염 여부가 증명되지는 않는다.</text><line x1="64" y1="448" x2="1376" y2="448" stroke="#3B3D43" stroke-width="1" /><text x="64" y="489" font-size="26" fill="#F2F3F5" font-weight="600" >02 / 본문에서 측정한 범위: 동결된 400개 사례의 오프라인 재생</text><rect x="64" y="516" width="376" height="94" fill="#1C1D22" stroke="#3B3D43"/><text x="86" y="552" font-size="25" fill="#F2F3F5" font-weight="600" >작성된 계약·호출 기록</text><text x="86" y="586" font-size="20" fill="#B5B8C2" font-weight="400" >정상·의도 이탈·공격 변형</text><line x1="448" y1="562" x2="504" y2="562" stroke="#ADB4D4" stroke-width="1.5" /><path d="M 498 556 L 506 562 L 498 568" fill="none" stroke="#ADB4D4" stroke-width="1.5"/><rect x="520" y="516" width="376" height="94" fill="#1C1D22" stroke="#3B3D43"/><text x="542" y="552" font-size="25" fill="#F2F3F5" font-weight="600" >5개 보호 체계 비교</text><text x="542" y="586" font-size="20" fill="#B5B8C2" font-weight="400" >같은 사례와 판정 기준</text><line x1="904" y1="562" x2="960" y2="562" stroke="#ADB4D4" stroke-width="1.5" /><path d="M 954 556 L 962 562 L 954 568" fill="none" stroke="#ADB4D4" stroke-width="1.5"/><rect x="976" y="516" width="400" height="94" fill="#1C1D22" stroke="#3B3D43"/><text x="998" y="552" font-size="25" fill="#F2F3F5" font-weight="600" >안전성·완료율·오류</text><text x="998" y="586" font-size="20" fill="#B5B8C2" font-weight="400" >400개 × 5개 체계 = 2,000건</text><text x="64" y="648" font-size="22" fill="#B5B8C2" font-weight="400" >실제 지갑을 대상으로 한 400회 공격 실험이나 자연어 동의 실험으로 읽어서는 안 된다.</text><line x1="64" y1="682" x2="1376" y2="682" stroke="#3B3D43" stroke-width="1" /><text x="64" y="723" font-size="26" fill="#38ABA2" font-weight="600" >03 / 별도 어댑터 경로: 실행 전후에 상태를 잇는 구조</text><rect x="64" y="750" width="280" height="94" fill="#1C1D22" stroke="#38ABA2"/><text x="86" y="786" font-size="25" fill="#38ABA2" font-weight="600" >평가</text><text x="86" y="820" font-size="20" fill="#B5B8C2" font-weight="400" >evaluate · 규칙 검사</text><line x1="354" y1="796" x2="390" y2="796" stroke="#38ABA2" stroke-width="1.5" /><path d="M 384 790 L 392 796 L 384 802" fill="none" stroke="#38ABA2" stroke-width="1.5"/><rect x="408" y="750" width="280" height="94" fill="#1C1D22" stroke="#38ABA2"/><text x="430" y="786" font-size="25" fill="#38ABA2" font-weight="600" >예약</text><text x="430" y="820" font-size="20" fill="#B5B8C2" font-weight="400" >reserve · 사용량 확보</text><line x1="698" y1="796" x2="734" y2="796" stroke="#38ABA2" stroke-width="1.5" /><path d="M 728 790 L 736 796 L 728 802" fill="none" stroke="#38ABA2" stroke-width="1.5"/><rect x="752" y="750" width="280" height="94" fill="#1C1D22" stroke="#38ABA2"/><text x="774" y="786" font-size="25" fill="#38ABA2" font-weight="600" >실행</text><text x="774" y="820" font-size="20" fill="#B5B8C2" font-weight="400" >execute · 허용 작업</text><line x1="1042" y1="796" x2="1078" y2="796" stroke="#38ABA2" stroke-width="1.5" /><path d="M 1072 790 L 1080 796 L 1072 802" fill="none" stroke="#38ABA2" stroke-width="1.5"/><rect x="1096" y="750" width="280" height="94" fill="#1C1D22" stroke="#38ABA2"/><text x="1118" y="786" font-size="25" fill="#38ABA2" font-weight="600" >대조·정산</text><text x="1118" y="820" font-size="20" fill="#B5B8C2" font-weight="400" >reconcile · 결과 확인</text><text x="64" y="891" font-size="23" fill="#F2F3F5" font-weight="700" >구현 경계</text><text x="64" y="928" font-size="23" fill="#B5B8C2" font-weight="400" >단일 프로세스의 메모리 상태 · 지갑 전체의 서명 중단을 보장하지 않음</text><text x="64" y="965" font-size="23" fill="#B5B8C2" font-weight="400" >사용자의 실제 동의 보장은 별도 과제 · 세 경로의 증거를 하나의 실험으로 합치지 않음</text>
<line x1="64" y1="1009" x2="1376" y2="1009" stroke="#3B3D43" stroke-width="1" />
<text x="64" y="1045" font-size="18" fill="#B5B8C2" font-weight="400" >Source: 본 연구의 구현 구조와 오프라인 재생 실험 설계.</text><text x="64" y="1074" font-size="18" fill="#B5B8C2" font-weight="400" >화살표는 각 경로 내부의 처리 순서다. 선택 컴파일러 → 실지갑 보호의 종단 간 검증을 뜻하지 않는다.</text>
</svg>