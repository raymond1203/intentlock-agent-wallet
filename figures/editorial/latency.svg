<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
<title id="title">지연 시간은 무엇을 잰 값인지부터 구분해야 한다</title>
<desc id="desc">원본 수치를 유지한 전체 축과, 로컬 규칙 경로만 따로 확대한 축 Source: 본 연구 주 실험 meanLatencyMs · 최초 시도 400건/체계 · 각 값은 소수 셋째 자리까지 표시. 지갑 종단 간 처리 시간이나 모델 추론만의 속도가 아니다. RPC·서명·블록 확정 시간을 대표하지 않는다.</desc>
<style>text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",sans-serif;font-variant-numeric:tabular-nums}line,rect,circle,path{vector-effect:non-scaling-stroke}</style>
<rect x="0" y="0" width="1440" height="1180" fill="#121212" />
<text x="64" y="53" font-size="20" fill="#F2F3F5" font-weight="600" letter-spacing="2">INTENTLOCK / RESEARCH</text>
<text x="1376" y="53" font-size="20" fill="#B5B8C2" font-weight="500" text-anchor="end">FIGURE 05</text>
<line x1="64" y1="76" x2="1376" y2="76" stroke="#F2F3F5" stroke-width="1" />
<text x="720" y="143" font-size="38" fill="#F2F3F5" font-weight="700" text-anchor="middle">지연 시간은 무엇을 잰 값인지부터 구분해야 한다</text>
<text x="720" y="187" font-size="23" fill="#B5B8C2" font-weight="400" text-anchor="middle">원본 수치를 유지한 전체 축과, 로컬 규칙 경로만 따로 확대한 축</text>
<text x="64" y="251" font-size="26" fill="#F2F3F5" font-weight="700" >전체 비교 / 0–1,500 ms</text><text x="1376" y="251" font-size="22" fill="#B5B8C2" font-weight="400" text-anchor="end">호출 경로의 평균 지연</text><line x1="360" y1="281" x2="360" y2="565" stroke="#3B3D43" stroke-width="1" /><text x="360" y="593" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0</text><line x1="642.6666666666667" y1="281" x2="642.6666666666667" y2="565" stroke="#3B3D43" stroke-width="1" /><text x="642.6666666666667" y="593" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">500</text><line x1="925.3333333333334" y1="281" x2="925.3333333333334" y2="565" stroke="#3B3D43" stroke-width="1" /><text x="925.3333333333334" y="593" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">1,000</text><line x1="1208" y1="281" x2="1208" y2="565" stroke="#3B3D43" stroke-width="1" /><text x="1208" y="593" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">1,500</text><text x="64" y="313" font-size="23" fill="#ADB4D4" font-weight="600" >보호 장치 없음</text><rect x="360" y="292" width="0.003665480000001214" height="24" fill="#ADB4D4" data-system="NONE" data-metric="meanLatencyMs" data-value="0.006483750000002147" data-panel="full" data-axis-max="1500"/><text x="1376" y="312" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">0.006 ms</text><text x="64" y="367" font-size="23" fill="#ADB4D4" font-weight="600" >가드 모드 정책 모형</text><rect x="360" y="346" width="0.030805578666690054" height="24" fill="#ADB4D4" data-system="GUARD_MODE" data-metric="meanLatencyMs" data-value="0.05449100000004137" data-panel="full" data-axis-max="1500"/><text x="1376" y="366" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">0.054 ms</text><text x="64" y="421" font-size="23" fill="#ADB4D4" font-weight="600" >언어모델 검증기</text><rect x="360" y="400" width="795.0702893066663" height="24" fill="#ADB4D4" data-system="LLM_VERIFIER" data-metric="meanLatencyMs" data-value="1406.3743324999994" data-panel="full" data-axis-max="1500"/><text x="1376" y="420" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">1406.374 ms</text><text x="64" y="475" font-size="23" fill="#ADB4D4" font-weight="600" >호출별 정책</text><rect x="360" y="454" width="0.2248121493334323" height="24" fill="#ADB4D4" data-system="PER_CALL_POLICY" data-metric="meanLatencyMs" data-value="0.39766300000017507" data-panel="full" data-axis-max="1500"/><text x="1376" y="474" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">0.398 ms</text><text x="64" y="529" font-size="23" fill="#38ABA2" font-weight="600" >IntentLock</text><rect x="360" y="508" width="0.23987093333386975" height="24" fill="#38ABA2" data-system="INTENTLOCK" data-metric="meanLatencyMs" data-value="0.4243000000009488" data-panel="full" data-axis-max="1500"/><text x="1376" y="528" font-size="22" fill="#38ABA2" font-weight="600" text-anchor="end">0.424 ms</text><line x1="64" y1="625" x2="1376" y2="625" stroke="#F2F3F5" stroke-width="1" /><text x="64" y="672" font-size="26" fill="#F2F3F5" font-weight="700" >별도 확대 / 0–0.5 ms</text><text x="64" y="710" font-size="22" fill="#B5B8C2" font-weight="400" >언어모델 검증기를 제외한 네 체계 · 위 패널과 축 범위가 다름</text><line x1="360" y1="737" x2="360" y2="965" stroke="#3B3D43" stroke-width="1" /><text x="360" y="993" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0.0</text><line x1="529.6" y1="737" x2="529.6" y2="965" stroke="#3B3D43" stroke-width="1" /><text x="529.6" y="993" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0.1</text><line x1="699.2" y1="737" x2="699.2" y2="965" stroke="#3B3D43" stroke-width="1" /><text x="699.2" y="993" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0.2</text><line x1="868.8" y1="737" x2="868.8" y2="965" stroke="#3B3D43" stroke-width="1" /><text x="868.8" y="993" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0.3</text><line x1="1038.4" y1="737" x2="1038.4" y2="965" stroke="#3B3D43" stroke-width="1" /><text x="1038.4" y="993" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0.4</text><line x1="1208" y1="737" x2="1208" y2="965" stroke="#3B3D43" stroke-width="1" /><text x="1208" y="993" font-size="19" fill="#B5B8C2" font-weight="400" text-anchor="middle">0.5</text><text x="64" y="769" font-size="23" fill="#ADB4D4" font-weight="600" >보호 장치 없음</text><rect x="360" y="748" width="10.996440000003641" height="24" fill="#ADB4D4" data-system="NONE" data-metric="meanLatencyMs" data-value="0.006483750000002147" data-panel="zoom" data-axis-max="0.5"/><text x="1376" y="768" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">0.006 ms</text><text x="64" y="822" font-size="23" fill="#ADB4D4" font-weight="600" >가드 모드 정책 모형</text><rect x="360" y="801" width="92.41673600007016" height="24" fill="#ADB4D4" data-system="GUARD_MODE" data-metric="meanLatencyMs" data-value="0.05449100000004137" data-panel="zoom" data-axis-max="0.5"/><text x="1376" y="821" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">0.054 ms</text><text x="64" y="875" font-size="23" fill="#ADB4D4" font-weight="600" >호출별 정책</text><rect x="360" y="854" width="674.4364480002969" height="24" fill="#ADB4D4" data-system="PER_CALL_POLICY" data-metric="meanLatencyMs" data-value="0.39766300000017507" data-panel="zoom" data-axis-max="0.5"/><text x="1376" y="874" font-size="22" fill="#ADB4D4" font-weight="600" text-anchor="end">0.398 ms</text><text x="64" y="928" font-size="23" fill="#38ABA2" font-weight="600" >IntentLock</text><rect x="360" y="907" width="719.6128000016092" height="24" fill="#38ABA2" data-system="INTENTLOCK" data-metric="meanLatencyMs" data-value="0.4243000000009488" data-panel="zoom" data-axis-max="0.5"/><text x="1376" y="927" font-size="22" fill="#38ABA2" font-weight="600" text-anchor="end">0.424 ms</text><text x="64" y="1030" font-size="23" fill="#F2F3F5" font-weight="600" >언어모델 요청 경로와 로컬 규칙 경로는 포함하는 작업이 다르다. 속도 배수로 단순 비교하지 않는다.</text>
<line x1="64" y1="1079" x2="1376" y2="1079" stroke="#3B3D43" stroke-width="1" />
<text x="64" y="1115" font-size="18" fill="#B5B8C2" font-weight="400" >Source: 본 연구 주 실험 meanLatencyMs · 최초 시도 400건/체계 · 각 값은 소수 셋째 자리까지 표시.</text><text x="64" y="1144" font-size="18" fill="#B5B8C2" font-weight="400" >지갑 종단 간 처리 시간이나 모델 추론만의 속도가 아니다. RPC·서명·블록 확정 시간을 대표하지 않는다.</text>
</svg>